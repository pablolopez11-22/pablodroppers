<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <!-- Harley antigua (años 40, «panhead») dibujada al estilo del logo: crema, rojo y negro -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a33"/><stop offset=".55" stop-color="#e1261c"/><stop offset="1" stop-color="#8f140d"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset=".5" stop-color="#cdb894"/><stop offset="1" stop-color="#7d6d55"/></linearGradient>
    <radialGradient id="lamp" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#fffbea"/><stop offset=".5" stop-color="#ffe4a8"/><stop offset="1" stop-color="#c9a66a"/></radialGradient>
    <g id="wheel">
      <circle r="168" fill="#0e0d0d" stroke="#1c1a19" stroke-width="2"/>
      <circle r="150" fill="none" stroke="#151312" stroke-width="34"/>
      <circle r="132" fill="none" stroke="#ecd9b6" stroke-width="12"/>  <!-- banda blanca del neumático -->
      <circle r="168" fill="none" stroke="#2a2624" stroke-width="3"/>
      <circle r="112" fill="none" stroke="url(#chrome)" stroke-width="8"/>
      <g stroke="#cdb894" stroke-width="2.4">
        <path d="M0-108L0 108M-108 0L108 0M-76-76L76 76M76-76L-76 76M-41-100L41 100M41-100L-41 100M-100-41L100 41M100-41L-100 41M-20-106L20 106M20-106L-20 106M-106-20L106 20M106-20L-106 20M-60-90L60 90M60-90L-60 90M-90-60L90 60M90-60L-90 60"/>
      </g>
      <circle r="30" fill="url(#chrome)" stroke="#0e0d0d" stroke-width="4"/>
      <circle r="10" fill="#0e0d0d"/>
    </g>
  </defs>

  <!-- sombra en el suelo -->
  <ellipse cx="620" cy="738" rx="520" ry="16" fill="#000" opacity=".55"/>

  <!-- rueda trasera y delantera -->
  <use href="#wheel" x="300" y="560"/>
  <use href="#wheel" x="940" y="560"/>

  <!-- guardabarros (rojos, con filete crema) -->
  <path d="M118 548 A 186 186 0 0 1 470 452 L 488 470 A 168 168 0 0 0 140 560 Z" fill="url(#red)" stroke="#0e0d0d" stroke-width="4"/>
  <path d="M128 530 A 178 178 0 0 1 462 446" fill="none" stroke="#ecd9b6" stroke-width="3"/>
  <path d="M790 470 A 184 184 0 0 1 1118 500 L 1100 516 A 166 166 0 0 0 806 488 Z" fill="url(#red)" stroke="#0e0d0d" stroke-width="4"/>
  <path d="M800 460 A 176 176 0 0 1 1108 488" fill="none" stroke="#ecd9b6" stroke-width="3"/>

  <!-- cuadro -->
  <g fill="none" stroke="#2e2a27" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 560 L 450 372 L 812 318"/>        <!-- tubo trasero y tubo superior -->
    <path d="M812 330 L 690 610 L 470 612 L 300 560"/> <!-- tubo bajo y cuna -->
    <path d="M450 372 L 470 612"/>                  <!-- tubo del asiento -->
  </g>
  <g fill="none" stroke="#ecd9b6" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
    <path d="M300 556 L 450 368 L 812 314"/><path d="M812 326 L 690 606 L 470 608"/>
  </g>

  <!-- transmisión primaria y cadena -->
  <path d="M470 600 L 300 572" stroke="#cdb894" stroke-width="7" stroke-dasharray="10 5"/>
  <ellipse cx="505" cy="560" rx="62" ry="52" fill="#1d1a18" stroke="url(#chrome)" stroke-width="6"/>
  <circle cx="505" cy="560" r="16" fill="url(#chrome)"/>

  <!-- motor V-twin -->
  <g stroke="#0e0d0d" stroke-width="3">
    <path d="M560 470 Q 625 440 690 470 L 702 560 Q 625 610 548 560 Z" fill="url(#chrome)"/>   <!-- cárter -->
    <circle cx="625" cy="530" r="34" fill="#cdb894"/>
    <!-- cilindros con aletas -->
    <g transform="rotate(-24 590 470)">
      <rect x="560" y="360" width="62" height="112" rx="8" fill="#2a2624"/>
      <g fill="#cdb894"><rect x="552" y="368" width="78" height="7" rx="3"/><rect x="552" y="384" width="78" height="7" rx="3"/><rect x="552" y="400" width="78" height="7" rx="3"/><rect x="552" y="416" width="78" height="7" rx="3"/><rect x="552" y="432" width="78" height="7" rx="3"/><rect x="552" y="448" width="78" height="7" rx="3"/></g>
      <path d="M548 362 Q 591 320 634 362 Z" fill="url(#chrome)"/>  <!-- tapa «panhead» -->
    </g>
    <g transform="rotate(24 660 470)">
      <rect x="628" y="360" width="62" height="112" rx="8" fill="#2a2624"/>
      <g fill="#cdb894"><rect x="620" y="368" width="78" height="7" rx="3"/><rect x="620" y="384" width="78" height="7" rx="3"/><rect x="620" y="400" width="78" height="7" rx="3"/><rect x="620" y="416" width="78" height="7" rx="3"/><rect x="620" y="432" width="78" height="7" rx="3"/><rect x="620" y="448" width="78" height="7" rx="3"/></g>
      <path d="M616 362 Q 659 320 702 362 Z" fill="url(#chrome)"/>
    </g>
    <!-- filtro de aire redondo -->
    <circle cx="738" cy="470" r="30" fill="url(#chrome)"/><circle cx="738" cy="470" r="12" fill="#2a2624"/>
  </g>

  <!-- escapes «fishtail» -->
  <g fill="none" stroke="url(#chrome)" stroke-width="16" stroke-linecap="round">
    <path d="M560 470 C 520 520, 470 640, 360 650 L 160 650"/>
    <path d="M700 462 C 770 500, 770 650, 640 668 L 210 668"/>
  </g>
  <path d="M160 650 L 120 640 L 118 662 Z M210 668 L 170 660 L 168 682 Z" fill="#cdb894" stroke="#0e0d0d" stroke-width="2"/>

  <!-- depósito en lágrima (rojo, con raya crema) -->
  <path d="M520 360 C 540 300, 640 282, 760 290 C 820 296, 832 326, 812 350 C 760 380, 600 392, 520 380 Z" fill="url(#red)" stroke="#0e0d0d" stroke-width="5"/>
  <path d="M548 352 C 600 320, 700 312, 790 322" fill="none" stroke="#ecd9b6" stroke-width="4"/>
  <circle cx="690" cy="338" r="16" fill="#ecd9b6" stroke="#0e0d0d" stroke-width="3"/>
  <circle cx="690" cy="338" r="7" fill="#e1261c"/>
  <circle cx="640" cy="292" r="9" fill="url(#chrome)" stroke="#0e0d0d" stroke-width="2"/>  <!-- tapón -->

  <!-- asiento solo con muelles -->
  <path d="M380 330 C 400 300, 500 300, 530 324 C 520 344, 470 348, 420 346 C 396 345, 378 342, 380 330 Z" fill="#3a2418" stroke="#0e0d0d" stroke-width="4"/>
  <path d="M398 322 C 440 312, 490 312, 520 324" fill="none" stroke="#7a5236" stroke-width="3"/>
  <g fill="none" stroke="url(#chrome)" stroke-width="5"><path d="M420 346 l -8 10 l 16 6 l -16 6 l 16 6 l -8 8"/><path d="M500 344 l -8 10 l 16 6 l -16 6 l 16 6 l -8 8"/></g>

  <!-- horquilla «springer» -->
  <g fill="none" stroke-linecap="round">
    <path d="M820 300 L 940 560" stroke="#2e2a27" stroke-width="16"/>
    <path d="M846 290 L 960 548" stroke="url(#chrome)" stroke-width="9"/>
    <path d="M846 290 l 6 14 l -14 6 l 18 4 l -14 6 l 18 4 l -14 6 l 16 6" stroke="#ecd9b6" stroke-width="4"/>
  </g>
  <!-- manillar -->
  <path d="M818 268 C 790 230, 760 220, 720 226" fill="none" stroke="url(#chrome)" stroke-width="10" stroke-linecap="round"/>
  <path d="M736 224 L 700 228" stroke="#1d1a18" stroke-width="16" stroke-linecap="round"/>
  <!-- faro -->
  <circle cx="884" cy="276" r="40" fill="url(#chrome)" stroke="#0e0d0d" stroke-width="4"/>
  <circle cx="890" cy="276" r="30" fill="url(#lamp)" stroke="#8a7656" stroke-width="3"/>
  <!-- placa trasera y piloto -->
  <rect x="96" y="470" width="20" height="40" rx="4" fill="#e1261c" stroke="#0e0d0d" stroke-width="3"/>
</svg>
